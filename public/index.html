<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta
      name="description"
      content="Live quizzes, audience polls and private results for classrooms, in English, Arabic and Sorani Kurdish."
    />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta name="theme-color" content="#0a2747" />
    <title>AskShaubo</title>
    <link
      rel="preload"
      href="/fonts/lexend-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/kufam-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/style.css" />
    <link rel="icon" href="/mark.svg" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body data-view="loading">
    <a class="skip" href="#main">Skip to content</a>
    <div id="progress" aria-hidden="true"></div>
    <header id="topbar">
      <a class="brand" href="#/"
        ><img src="/mark.svg" alt="" width="36" height="36" /><span
          >AskShaubo</span
        ></a
      >
      <div id="preferences-slot"></div>
      <nav id="nav" aria-label="Account"></nav>
    </header>
    <aside id="rail" hidden></aside>
    <main id="main" tabindex="-1"></main>
    <footer id="footer">
      <nav aria-label="Support">
        <a href="#/help">Help center</a><a href="#/privacy">Privacy</a
        ><a href="#/terms">Terms</a>
      </nav>
    </footer>
    <div id="notice" role="status" aria-live="polite"></div>
    <script type="module" src="/ui.js"></script>
  </body>
</html>
