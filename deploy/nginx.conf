map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
 listen 8080;
 server_name _;
 client_max_body_size 9m;
 root /usr/share/nginx/html;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
 location ~ ^/(api/|live/|health$) {
  proxy_pass http://api:3000;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_read_timeout 1h;
 }
 location / { try_files $uri $uri/ =404; }
}
